apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: production
data:
  application-production.yml: |
    spring:
      datasource:
        hikari:
          maximum-pool-size: 30
          minimum-idle: 10
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
      data:
        redis:
          timeout: 3000ms
    
    logging:
      level:
        root: INFO
        com.ecommerce: INFO
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus