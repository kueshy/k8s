apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: production
type: Opaque
stringData:
  database-url: jdbc:postgresql://postgres-service:5432/ecommerce
  database-username: postgres
  database-password: postgres
  jwt-secret: super-secret-jwt-key-change-in-production-minimum-256-bits
  redis-password: redis-password-here