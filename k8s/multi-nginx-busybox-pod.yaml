apiVersion: v1
kind: Pod
metadata:
  name: multi-nginx-busybox
  labels:
    app: multi-demo
    purpose: exercise
spec:
  volumes:
    - name: shared-html
      emptyDir: {}

  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-html
          mountPath: /usr/share/nginx/html
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "250m"
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5

    - name: busybox-sidecar
      image: busybox:1.36
      command: ["/bin/sh"]
      args:
        - "-c"
        - |
          echo "<h1>Hello from multi-container Pod!</h1><p>Generated by BusyBox sidecar at $(date)</p>" > /shared-html/index.html && \
          echo "Busybox sidecar started - sleeping forever..." && \
          sleep infinity
      volumeMounts:
        - name: shared-html
          mountPath: /shared-html
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "64Mi"
          cpu: "100m"
      livenessProbe:
        exec:
          command:
            - sh
            - -c
            - "exit 0"   # trivial check; can be replaced with real health check later
        initialDelaySeconds: 15
        periodSeconds: 30