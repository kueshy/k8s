spring.application.name=k8s
# Expose all actuator endpoints over HTTP (or select specific ones)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Make health endpoint show full details (UP/DOWN + components)
management.endpoint.health.show-details=always
# Enable liveness & readiness state (Spring Boot auto-handles in K8s env)
# These are ON by default in Spring Boot 2.3+ when in Kubernetes, but explicit is good
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Optional: Expose individual probe paths if needed (already default)
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
# Optional: If you want more security later (for prod)
# management.endpoints.web.base-path=/actuator
# But keep default for now
# Optional: show details in groups
#management.endpoint.health.group.liveness.show-details=always
#management.endpoint.health.group.readiness.show-details=always
